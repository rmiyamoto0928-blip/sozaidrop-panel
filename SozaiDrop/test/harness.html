<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SozaiDrop 回帰テスト</title>
<style>
  body { font: 13px/1.6 -apple-system, "Hiragino Sans", sans-serif; background: #1b1b1b; color: #ddd; margin: 0; padding: 12px; display: flex; gap: 16px; }
  #left { flex: 1; min-width: 0; }
  #summary { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .ok { color: #7ec97f; }
  .ng { color: #ff7b6e; }
  #results { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  #panel { width: 380px; height: 660px; border: 1px solid #444; flex: none; }
</style>
</head>
<body>
<div id="left">
  <div id="summary">実行中…</div>
  <div id="results"></div>
</div>
<iframe id="panel"></iframe>

<script>
// ── CEP環境のスタブ ───────────────────────────
// 実機（Premiere）を起動せずに index.html + main.js をそのまま動かして、
// 絞り込み・表示・更新・挿入の挙動を機械的に検証するための仮想環境。
// パネル本体は iframe に読み込むので、パネルのCSSがこのページの表示を壊さない。
// 仮想ファイルはmacOS実機と同じNFD（濁点分解）で持つ（フォルダ名も同じ）。

var NFD = function (s) { return s.normalize('NFD'); };
var NFC = function (s) { return s.normalize('NFC'); };

var VFS = {};
// macOSのディスク上はフォルダ名も濁点分解(NFD)で保持されるので、ディレクトリもNFDで作る
function mkdirp(p) {
  var segs = NFD(p).split('/'); var acc = '';
  for (var i = 1; i < segs.length; i++) { acc += '/' + segs[i]; if (!VFS[acc]) VFS[acc] = { dir: true }; }
}
function addFile(p, mtime) { mkdirp(p.replace(/\/[^/]*$/, '')); VFS[NFD(p)] = { dir: false, mtimeMs: mtime || 1, data: '' }; }
function rmFile(p) { delete VFS[NFD(p)]; }
// フォルダごと消す（外付けドライブを抜いた・フォルダを移動/リネームしたの再現）。
// 中のファイルだけ消すとフォルダ自体は残るので、登録フォルダ消失の検査にならない
function rmTree(p) {
  var d = NFD(p);
  Object.keys(VFS).forEach(function (k) {
    if (k === d || k.indexOf(d + '/') === 0) delete VFS[k];
  });
}

var ROOT_SE = '/T/効果音素材';
var ROOT_BGM = '/T/BGM素材';
addFile(ROOT_SE + '/衝撃/ドンッ.wav');
addFile(ROOT_SE + '/衝撃/ズドン低音.wav');
addFile(ROOT_SE + '/キラキラ/キラン.wav');
addFile(ROOT_SE + '/whoosh_se.wav');
addFile(ROOT_BGM + '/明るい/ハッピーポップ.mp3');
addFile(ROOT_BGM + '/しっとり/バラード.mp3');
addFile(ROOT_BGM + '/しっとり/夜の街.mp3');

var SETTINGS_FILE = '/home/Library/Application Support/SozaiDrop/settings.json';

// trueにすると設定ファイルの書き込みが必ず失敗する（権限なし・ディスク満杯の再現）。
// 保存できなくても画面の切り替えが効くこと・理由が表示されることを確かめるために使う
var WRITE_FAIL = false;

var fsStub = {
  readdirSync: function (d) {
    d = NFD(d);
    if (!VFS[d] || !VFS[d].dir) throw new Error('ENOENT ' + d);
    // constructor / toString / __proto__ という名前のフォルダを取りこぼさないよう、
    // 素の {} ではなくプロトタイプ無しの入れ物で「もう出した名前」を覚える
    var out = [], seen = Object.create(null);
    Object.keys(VFS).forEach(function (p) {
      if (p.indexOf(d + '/') !== 0) return;
      var first = p.slice(d.length + 1).split('/')[0];
      if (!seen[first]) { seen[first] = 1; out.push(first); }
    });
    return out;
  },
  statSync: function (p) {
    p = NFD(p);
    var e = VFS[p];
    if (!e) throw new Error('ENOENT ' + p);
    return { isDirectory: function () { return !!e.dir; }, mtimeMs: e.mtimeMs || 0 };
  },
  existsSync: function (p) { return !!VFS[NFD(p)]; },
  readFileSync: function (p) { var e = VFS[NFD(p)]; if (!e || e.dir) throw new Error('ENOENT'); return e.data; },
  writeFileSync: function (p, d) {
    if (WRITE_FAIL) throw new Error('EACCES: permission denied ' + p);
    mkdirp(p.replace(/\/[^/]*$/, '')); VFS[NFD(p)] = { dir: false, data: d, mtimeMs: 1 };
  },
  mkdirSync: function (p) { mkdirp(p); },
  unlinkSync: function (p) { delete VFS[NFD(p)]; },
  copyFileSync: function (a, b) { var e = VFS[NFD(a)]; if (!e) throw new Error('ENOENT'); VFS[NFD(b)] = { dir: false, data: e.data, mtimeMs: e.mtimeMs }; },
  renameSync: function (a, b) { var e = VFS[NFD(a)]; if (!e) throw new Error('ENOENT'); VFS[NFD(b)] = e; delete VFS[NFD(a)]; }
};

var pathStub = {
  join: function () {
    var parts = Array.prototype.slice.call(arguments).filter(function (s) { return s !== '' && s !== '.'; });
    return parts.join('/').replace(/\/+/g, '/');
  },
  basename: function (p) { return String(p).split('/').pop(); },
  dirname: function (p) { var s = String(p).split('/'); s.pop(); return s.join('/') || '.'; },
  extname: function (p) { var m = String(p).match(/(\.[^./]+)$/); return m ? m[1] : ''; },
  // 実機のNode.jsと同じく、濁点分解の違いは吸収しない（ここでNFD正規化すると
  // 「ルートがNFC・中身がNFD」の取りこぼしをテストが見逃す）
  relative: function (from, to) {
    return to.indexOf(from + '/') === 0 ? to.slice(from.length + 1) : to;
  }
};

var osStub = { homedir: function () { return '/home'; } };

// zip書き出しで実際に何のコマンドへ何を渡したかを検査するための記録
var CP_LOG = [];
var cpStub = {
  execFile: function (cmd, args) {
    CP_LOG.push({ cmd: cmd, args: args });
    var cb = arguments[arguments.length - 1];
    if (typeof cb === 'function') cb(null);
  }
};

var PICK_FOLDER = ROOT_SE;
// 「送る」の保存ダイアログ。既定は「キャンセルされた」= err:1
var SAVE_DIALOG = { err: 1 };

// 曲の長さ計測（Audioスタブ）。ここに登録したパスだけ秒数を返し、
// 未登録は実機の計測失敗と同じく onerror にする
var AUDIO_DUR = {};
function setDuration(p, sec) { AUDIO_DUR[NFD(p)] = sec; }

// プロジェクト内素材。実機のJSXは trail の先頭にプロジェクト名を置くので
// sub は「案件A/SE/衝撃」の形になる（SE と SE予備 は前方一致の誤爆確認用）
var PROJECT_RECORDS = [
  ['案件A/SE', 'プロジェクトSE.wav', '/proj/プロジェクトSE.wav'],
  ['案件A/SE/衝撃', 'プロジェクト衝撃.wav', '/proj/プロジェクト衝撃.wav'],
  ['案件A/SE予備', 'プロジェクト予備.wav', '/proj/プロジェクト予備.wav'],
  ['案件A/BGM', 'プロジェクトBGM.mp3', '/proj/プロジェクトBGM.mp3']
];
// 'ok' | 'err' | 'silent'（空の応答が返る） | 'hang'（返事そのものが返らない）。
// 'hang' はPremiereが黙ったままの状態で、15秒の保険タイマーの検査に使う
var PROJECT_MODE = 'ok';
// Premiereから返事が返るまでの遅さ(ms)。⟳を連打したとき、先に始めた古い走査の応答が
// あとから届く状況を作るために使う（応答の中身は呼ばれた瞬間のPROJECT_RECORDSで決まる）
var PROJECT_DELAY = 0;
var EVAL_LOG = [];
function projectReply() {
  if (PROJECT_MODE === 'err') return 'ERR:テスト用の走査エラー';
  if (PROJECT_MODE === 'silent') return '';
  if (PROJECT_RECORDS.length === 0) return 'EMPTY';
  return PROJECT_RECORDS.map(function (r) { return r.join(String.fromCharCode(2)); }).join(String.fromCharCode(1));
}

function installStubs(w) {
  w.cep_node = {
    require: function (m) {
      if (m === 'fs') return fsStub;
      if (m === 'path') return pathStub;
      if (m === 'os') return osStub;
      if (m === 'child_process') return cpStub;
      throw new Error('unknown module ' + m);
    }
  };
  // PICK_FOLDER = null ＝ ダイアログで「キャンセル」を押した状態（実機は err≠0 で返る）
  w.cep = { fs: { showOpenDialog: function () {
                    return (PICK_FOLDER === null) ? { err: 1, data: [] } : { err: 0, data: [PICK_FOLDER] };
                  },
                  showSaveDialogEx: function () { return SAVE_DIALOG; } } };
  w.CSInterface = function () {};
  w.CSInterface.prototype.evalScript = function (script, cb) {
    EVAL_LOG.push(script);
    var reply = '';
    var delay = 0;
    // 走査の応答だけ遅らせられるようにする（挿入の応答まで遅くすると他のテストが待たされるため）
    if (script.indexOf('sdListProjectAudio') === 0) {
      // 返事そのものを返さない（コールバックを呼ばない）＝Premiereが黙ったまま
      if (PROJECT_MODE === 'hang') return;
      reply = projectReply(); delay = PROJECT_DELAY;
    }
    else if (script.indexOf('sdInsertAudioAtHeads') === 0) reply = 'OK:A3 に 1件配置しました';
    else if (script.indexOf('sdBulkInsertAudio') === 0) reply = 'OK:A3 に 2件配置しました';
    if (cb) w.setTimeout(function () { cb(reply); }, delay);
  };
  // srcを入れた瞬間に「長さが分かった/分からなかった」を返す偽Audio。
  // AUDIO_DUR に登録した素材だけ onloadedmetadata（60秒以上ならBGM判定に使われる）
  w.Audio = function () {
    var o = {
      preload: '', volume: 1, duration: NaN, playCount: 0, pauseCount: 0,
      play: function () { o.playCount++; return Promise.resolve(); },
      pause: function () { o.pauseCount++; },
      load: function () {}, removeAttribute: function () { o._src = ''; }
    };
    Object.defineProperty(o, 'src', {
      get: function () { return o._src || ''; },
      set: function (v) {
        o._src = v;
        var real = NFD(decodeURIComponent(String(v).replace(/^file:\/\//, '')));
        var d = AUDIO_DUR[real];
        w.setTimeout(function () {
          if (d > 0) { o.duration = d; if (o.onloadedmetadata) o.onloadedmetadata(); }
          else if (o.onerror) o.onerror();
        }, 0);
      }
    });
    return o;
  };
}

// ── アサーション ──────────────────────────────
var pass = 0, fail = 0, lines = [];
function ok(name, cond, detail) {
  if (cond) { pass++; lines.push('  PASS  ' + name); }
  else { fail++; lines.push('  FAIL  ' + name + (detail ? '  → ' + detail : '')); }
}
function eq(name, actual, expected) {
  ok(name, actual === expected, 'actual=' + JSON.stringify(actual) + ' expected=' + JSON.stringify(expected));
}
function section(t) { lines.push(''); lines.push('■ ' + t); }
// 実行環境の都合で「判定そのものが成立しない」ものだけSKIPにする（合否には数えない）。
// 常に真になるアサートを書いてPASS数を水増ししないための逃げ道。
function skip(name, why) { lines.push('  SKIP  ' + name + '  → ' + why); }

var W, D;
function $(sel) { return D.querySelector(sel); }
function $$(sel) { return Array.prototype.slice.call(D.querySelectorAll(sel)); }
function rows() { return $$('#grid .card.row'); }
function rowNames() { return rows().map(function (r) { return r.querySelector('.rname').textContent; }); }
// ★よく使う欄は下の通常グループと同じ素材を重複表示するので、
// 「何件あるか」を数えるときは必ず通常グループだけを見る
function bodyRows() {
  var out = [], inFav = false, el = $('#grid').firstElementChild;
  while (el) {
    if (el.classList.contains('ghead')) inFav = el.classList.contains('fav');
    else if (!inFav && el.classList.contains('row')) out.push(el);
    el = el.nextElementSibling;
  }
  return out;
}
function bodyNames() { return bodyRows().map(function (r) { return NFC(r.querySelector('.rname').textContent); }); }
// ★よく使う見出しの次から、次の見出しまでが★の中身
function favRows() {
  var head = $('#grid .ghead.fav');
  if (!head) return [];
  var out = [], el = head.nextElementSibling;
  while (el && !el.classList.contains('ghead')) {
    if (el.classList.contains('row')) out.push(el);
    el = el.nextElementSibling;
  }
  return out;
}
function favNames() { return favRows().map(function (r) { return NFC(r.querySelector('.rname').textContent); }); }
// ④のグループ見出しの表示名（★よく使うは除く）。DOMに出ている順のまま・正規化もしない。
// walk() の sub が濁点合成(NFC)基準でそろっているかは、この文字列でしか分からない
// （③のプルダウンは pathN から作り直すので、そちらを見ても取りこぼす）
function groupHeadNames() {
  return $$('#grid .ghead').filter(function (h) { return !h.classList.contains('fav'); })
    .map(function (h) { return h.querySelector('.gname').textContent; });
}
// display:none の要素は幅も高さも0になるため、「はみ出さない」「2行に折れない」系の
// アサートが中身を見ずに素通りしてしまう。測る前に必ず「本当に見えている」ことを確かめる
function visible(el) {
  if (!el) return false;
  var r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0;
}
function allVisible(name, els) {
  var bad = els.filter(function (el) { return !visible(el); });
  ok(name + 'が実際に画面に出ている（幅・高さが0でない）', els.length > 0 && bad.length === 0,
     els.length === 0 ? '対象の要素が1つも無い' : bad.length + '/' + els.length + '個が非表示');
}
function rowByName(n) {
  var hit = null;
  bodyRows().forEach(function (r) { if (!hit && NFC(r.querySelector('.rname').textContent) === n) hit = r; });
  return hit;
}
// ③の項目の文字から件数を外す。3-a（フリー/楽曲）はボタンで「フリー 3」、
// 3-b/3-c（場面・内訳）はプルダウンで「ポップ（3）」と作りが違うので、両方の形を落とす
function stripCount(t) { return String(t).replace(/（\d+）$/, '').replace(/ \d+$/, ''); }
// 同じ2つの形から件数だけを取り出す（付いていなければ0）
function countIn(t) {
  var m = String(t).match(/（(\d+)）$/) || String(t).match(/ (\d+)$/);
  return m ? +m[1] : 0;
}
// ③の段の中身（lic=フリー/楽曲・scene=場面・sub=内訳）を上から順に。行ごと隠れていても
// 落ちないよう、要素が無いときは目印の文字列を返す（querySelectorを素で呼ぶと以降の検査が全部死ぬ）。
// 3-aはボタン列、3-b/3-cはプルダウンなので、どちらの作りでも読めるようにする
function tagTexts(row) {
  var el = $('#' + row + 'Filter');
  if (!el) return ['(行が無い)'];
  if (el.querySelector('select')) {
    return $$('#' + row + 'Filter option').map(function (o) { return o.textContent; });
  }
  return $$('#' + row + 'Filter .kf').map(function (b) { return b.textContent; });
}
function sceneTexts() { return tagTexts('scene'); }
function licTexts() { return tagTexts('lic'); }
function subTexts() { return tagTexts('sub'); }
// 「ポップ（24）」のような項目を名前だけで引く（件数は毎回変わるため）
function tagTextByName(row, n) {
  var hit = '(該当する項目が無い)';
  tagTexts(row).forEach(function (t) { if (stripCount(t) === n) hit = t; });
  return hit;
}
function sceneTextByName(n) { return tagTextByName('scene', n); }
// 内訳（3-c）の「すべて」の件数 と 残りの項目の件数の合計 を「10/10」の形で返す。
// 内訳フォルダに入っていない素材の行き先（「― 内訳なし」）が無いと、この2つがずれる
function subTotals() {
  var all = -1, sum = 0;
  subTexts().forEach(function (t) {
    var n = countIn(t);
    if (stripCount(t) === 'すべて') all = n; else sum += n;
  });
  return all + '/' + sum;
}
// その段が画面に出ているか（.fstep.hidden なら段ごと非表示）
function tagRowShown(row) {
  var step = $('#' + row + 'Step');
  return !!step && !step.classList.contains('hidden');
}
// いま選ばれている項目の名前（件数を外したもの）。ボタン段は点灯（.on）、
// プルダウン段はいま選ばれている選択肢を見る
function tagOn(row) {
  var row0 = $('#' + row + 'Filter');
  var sel = row0 ? row0.querySelector('select') : null;
  if (sel) {
    var o = sel.options[sel.selectedIndex];
    return o ? stripCount(o.textContent) : '(選択なし)';
  }
  var el = $('#' + row + 'Filter .kf.on');
  return el ? stripCount(el.textContent) : '(選択なし)';
}
// 同じ名前の項目が2つ以上あればその名前を返す（無ければ空配列）。
// 実機のフォルダ名は濁点分解(NFD)、③のタグはNFCで組み立てるため、見た目が同じでも
// 文字コードが違うことがある。照合は必ずNFCに揃えてから行う
function dupTagNames(row) {
  var vals = tagTexts(row).map(function (t) { return NFC(stripCount(t)); });
  return vals.filter(function (v, i) { return vals.indexOf(v) !== i; });
}
// 同じ「値」の選択肢が2つ以上あればその値を返す（無ければ空配列）。
// 本体は change のとき sel.value しか見ない（main.js の bindTagSelect）ので、値がぶつかると
// 「どちらを選んだか」を本体もテストも区別できなくなる＝見た目の名前ではなく値の重複を直に見張る。
// 受け皿の値（SUB_NONE）が実フォルダ名とぶつかった事故を、選択状態の当てずっぽうに頼らず捕まえる
function dupTagValues(row) {
  var el = $('#' + row + 'Filter');
  if (!el || !el.querySelector('select')) return [];
  var vals = $$('#' + row + 'Filter option').map(function (o) { return NFC(o.value); });
  return vals.filter(function (v, i) { return vals.indexOf(v) !== i; });
}
// 濁点の書き方だけが違う文字列は、そのまま並べても目で見分けが付かない
// （「ド」＝1文字 と 「ト」＋濁点記号 が同じに見える）。落ちたときに違いが分かるよう、
// 分解された濁点記号だけ <U+3099> の形で見えるようにする
function showMark(s) {
  return String(s).replace(/[゙゚̀-ͯ]/g, function (c) {
    return '<U+' + c.charCodeAt(0).toString(16).toUpperCase() + '>';
  });
}
function eqText(name, actual, expected) {
  ok(name, actual === expected, 'actual=' + showMark(actual) + ' expected=' + showMark(expected));
}
// ③の段の見出し（「③ 場面」「③ ビン」）。②切替の通知文や案内文がこの実ラベルと
// 食い違っていないかを見るために使う（文言だけ古くなる事故を防ぐ）
function sceneLabel() { var el = $('#sceneLabel'); return el ? el.textContent : '(見出しが無い)'; }
// 3-aの段の見出し（「フリー/楽曲」）。0件の案内文がこの実ラベルと食い違っていないかを見る
// （3-aには③のような番号が無いので、案内文は見出しの言葉をそのまま使う必要がある）
function licLabel() { var el = $('#licStep .fnum'); return el ? el.textContent : '(見出しが無い)'; }
// 効果音とBGMをまとめて指す呼び名（いまは「効果音・BGM」）。この語は index.html の
// ボタン説明と main.js のメッセージの両方に出るので、期待値に直書きすると
// 片方だけ呼び名が変わった食い違いを素通りさせる。実際に画面に出ている
// 「送る」ボタンの説明から取り出して、メッセージ側と突き合わせる
function sendKindWord() {
  var m = String($('#btnSend').getAttribute('title') || '').match(/^チェックした(.+?)をzipに/);
  return m ? m[1] : '(ボタン説明から呼び名を取り出せない)';
}
// 画面に出ているボタンの文字。案内文がボタンを名指しするときの期待値をここから作る＝
// ボタンの文言を変えたときに「案内文だけ古いまま」を検査が見逃さない（本体の btnName と同じ考え方）
function btnLabel(id) {
  var b = $('#' + id);
  return b ? String(b.textContent || '').replace(/\s+/g, ' ').trim() : '(' + id + 'が無い)';
}
// 「⋯」の中に畳んだ操作の言い方（本体の moreItem と同じ形。ここも直書きしない）
function moreItemLabel(id) { return '「' + btnLabel('btnMore') + '」の中の「' + btnLabel(id) + '」'; }
// ＋フォルダの完了メッセージが走査の完了メッセージの頭に付く。フォルダの表示名は
// 本体の rootLabel()（同名ルートには親名が付く）から引く＝名前を2か所に書かない
function addedPrefix(root) { return '「' + W.rootLabel(root) + '」を登録しました ／ '; }
// sdListProjectAudio() が何回呼ばれたか＝走査の本体（rescanRun）が何回走ったか
function scanRunCount() {
  return EVAL_LOG.filter(function (s) { return s.indexOf('sdListProjectAudio') === 0; }).length;
}
function status() { return $('#status').textContent; }
function statusClass() { return $('#status').className; }

// ── 文字の読みやすさ（コントラスト比）─────────
// 文字色だけを見ても読みやすさは決まらない。「その要素が実際に何の上に乗るか」で決まるので、
// 背景が透明なら親をさかのぼって実際の背景色を求めてから比べる（WCAGの計算式）
function lum(c) {
  var m = String(c).match(/\d+(\.\d+)?/g);
  if (!m) return 0;
  var v = m.slice(0, 3).map(function (x) {
    x = x / 255;
    return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];

function ratio(fg, bg) {
  var a = lum(fg), b = lum(bg);
  return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);

function realBg(el) {
  var n = el;
  while (n && n.nodeType === 1) {
    var b = W.getComputedStyle(n).backgroundColor;
    if (b && b !== 'transparent' && !/rgba\(0, 0, 0, 0\)/.test(b)) return b;
    n = n.parentElement;
  }
  return W.getComputedStyle(D.body).backgroundColor;
}
function contrastOk(name, el) {
  var label = name + 'のコントラストが4.5:1以上';
  if (!visible(el)) { ok(label, false, '要素が画面に出ていないので測れない'); return; }
  var fg = W.getComputedStyle(el).color;
  var bg = realBg(el);
  var r = ratio(fg, bg);
  ok(label, r >= 4.5, fg + ' on ' + bg + ' → ' + r.toFixed(2) + ':1');
}
// ── 色の見分けやすさ（ΔE2000）─────────────────
// 「別の色になっているか」を rgb の文字列が違うかどうかで見ると、人の目には同じにしか見えない色でも
// 通ってしまう（①の座布団 #cfe0f5 とグループ見出しの帯 #c6d9f1 は最大チャンネル差9・ΔE2000＝2.0＝
// 並べても見分けられないのに「違う色だから合格」になっていた。1周目レビューで発覚・2026-08-05）。
// 人の目の見え方に合わせた尺度（CIE ΔE2000）で測る。目安：2以下＝ほぼ同じに見える／
// 5前後＝よく見れば違う／10以上＝はっきり別の色。この harness では 10 を合格ラインにする
function labOf(c) {
  var m = String(c).match(/[\d.]+/g);
  if (!m || m.length < 3) return null;
  var v = m.slice(0, 3).map(function (x) {
    x = x / 255;
    return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
  });
  var X = (v[0] * 0.4124564 + v[1] * 0.3575761 + v[2] * 0.1804375) / 0.95047;
  var Y = (v[0] * 0.2126729 + v[1] * 0.7151522 + v[2] * 0.0721750);
  var Z = (v[0] * 0.0193339 + v[1] * 0.1191920 + v[2] * 0.9503041) / 1.08883;
  function f(t) { return t > 216 / 24389 ? Math.pow(t, 1 / 3) : (841 / 108) * t + 4 / 29; }
  var fx = f(X), fy = f(Y), fz = f(Z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function deltaE(c1, c2) {
  var A = labOf(c1), B = labOf(c2);
  if (!A || !B) return -1;   // 色として読めない値は「測れない」＝不合格側に倒す
  var rad = Math.PI / 180, deg = 180 / Math.PI, P25 = Math.pow(25, 7);
  var C1 = Math.sqrt(A[1] * A[1] + A[2] * A[2]), C2 = Math.sqrt(B[1] * B[1] + B[2] * B[2]);
  var Cb = (C1 + C2) / 2;
  var G = 0.5 * (1 - Math.sqrt(Math.pow(Cb, 7) / (Math.pow(Cb, 7) + P25)));
  var a1 = (1 + G) * A[1], a2 = (1 + G) * B[1];
  var C1p = Math.sqrt(a1 * a1 + A[2] * A[2]), C2p = Math.sqrt(a2 * a2 + B[2] * B[2]);
  var h1 = (Math.atan2(A[2], a1) * deg + 360) % 360;
  var h2 = (Math.atan2(B[2], a2) * deg + 360) % 360;
  var dL = B[0] - A[0], dC = C2p - C1p, dh = 0;
  if (C1p * C2p !== 0) {
    dh = h2 - h1;
    if (dh > 180) dh -= 360; else if (dh < -180) dh += 360;
  }
  var dH = 2 * Math.sqrt(C1p * C2p) * Math.sin(dh * rad / 2);
  var Lb = (A[0] + B[0]) / 2, Cbp = (C1p + C2p) / 2, hs = h1 + h2, hb;
  if (C1p * C2p === 0) hb = hs;
  else if (Math.abs(h1 - h2) > 180) hb = (hs + (hs < 360 ? 360 : -360)) / 2;
  else hb = hs / 2;
  var T = 1 - 0.17 * Math.cos((hb - 30) * rad) + 0.24 * Math.cos(2 * hb * rad)
            + 0.32 * Math.cos((3 * hb + 6) * rad) - 0.20 * Math.cos((4 * hb - 63) * rad);
  var Sl = 1 + (0.015 * Math.pow(Lb - 50, 2)) / Math.sqrt(20 + Math.pow(Lb - 50, 2));
  var Sc = 1 + 0.045 * Cbp;
  var Sh = 1 + 0.015 * Cbp * T;
  var Rt = -Math.sin(2 * (30 * Math.exp(-Math.pow((hb - 275) / 25, 2))) * rad)
           * 2 * Math.sqrt(Math.pow(Cbp, 7) / (Math.pow(Cbp, 7) + P25));
  return Math.sqrt(Math.pow(dL / Sl, 2) + Math.pow(dC / Sc, 2) + Math.pow(dH / Sh, 2)
                   + Rt * (dC / Sc) * (dH / Sh));
}
// ★よく使う帯（.ghead.fav）や☑選択中の行（.card.row.checked）は、いつも画面に出ているとは限らない。
// 変数の値を読むやり方だと規則側の直書きを取り逃がすので、実物の要素に一時的にそのクラスを付けて
// 本物のカスケード（指定の強さ・並び順）で計算させ、色を読んだらすぐ元に戻す（hoverProbe と同じ考え方）
// 要素が無いときに getComputedStyle(null) を呼ぶと TypeError で harness ごと落ち、
// 以降の検査（37件）が丸ごと走らないまま HARNESS ERROR で終わる。色として絶対に一致しない
// 文字列を返して「その1件だけ赤くする」形にする
function styleOf(el, prop) {
  if (!el) return '(要素が無い)';
  return W.getComputedStyle(el)[prop];
}
function bgWithClass(el, cls) {
  if (!el) return '(要素が無い)';
  var had = el.classList.contains(cls);
  if (!had) el.classList.add(cls);

}
// 配色の変数（css/style.css の :root）から、画面に実際に効いている色を rgb() の形で取り出す。
// 期待値に色を直書きすると配色を替えるたびにテストが赤くなるので、必ずこれ経由で比べる
// （＝検査したいのは「その役割の色が当たっているか」であって、特定の色番号ではない）。
function cssVar(name) {
  // 先に「:root にその変数が本当にあるか」を見る。無いまま下の probe を作ると、probe 側も
  // 規則側も同じように var() が無効になって currentColor などへ化け、"壊れた者どうしが一致"して
  // 全部の比較が素通りする（--sd-sec1 の行を消すと①③の色分けが丸ごと消えるのに ALL PASS だった。
  // 1周目レビューで実測・2026-08-05）。無いときは色として絶対に一致しない文字列を返して赤くする
  var raw = W.getComputedStyle(D.documentElement).getPropertyValue(name).trim();
  if (!raw) return '(:root に ' + name + ' が無い)';
  // 値が「色として読めるか」まで見る。#を打ち忘れた等で色にならない値だと、規則側の
  // color/border-color は「無効」扱いで currentColor（＝親から受け継いだ色）に化ける。
  // probe も同じように化けるので、変数の有無だけ見ていると"壊れた者どうしが一致"して素通りする。
  // 親の色をわざと変えた2つの probe で測り、答えが変われば「受け継いだ色に化けた」と分かる
  function probeWith(base) {
    var host = D.createElement('span');
    host.style.color = base; host.style.display = 'none';
    var probe = D.createElement('span');
    probe.style.color = 'var(' + name + ')';
    host.appendChild(probe);
    W.document.body.appendChild(host);
    var v = W.getComputedStyle(probe).color;
    host.parentNode.removeChild(host);
    return v;
  }
  var v1 = probeWith('rgb(1, 2, 3)'), v2 = probeWith('rgb(254, 253, 252)');
  if (v1 !== v2) return '(' + name + ' の値が色として読めない: ' + raw + ')';
  return v1;

// ヘッドレス実行ではカーソルを乗せられないので、パネルのCSSの「:hover」を
// 一時的にクラス（.__hv）へ写し取り、そのクラスを付けて実際の計算値を見る。
// CSSの文字列一致ではなく本物のカスケード（指定の強さ・並び順）で決まるため、
// 「.card:hover より強い指定が要る」という意図まで検査できる
function hoverProbe(el, fn) {
  var added = [];
  Array.prototype.slice.call(D.styleSheets).forEach(function (sh) {
    var rules;
    try { rules = sh.cssRules; } catch (e) { return; }
    var clones = [];
    Array.prototype.slice.call(rules).forEach(function (r) {
      if (r.selectorText && r.selectorText.indexOf(':hover') >= 0) {
        clones.push(r.cssText.replace(/:hover/g, '.__hv'));
      }
    });
    clones.forEach(function (t) {
      try { added.push({ sh: sh, i: sh.insertRule(t, sh.cssRules.length) }); } catch (e) {}
    });
  });
  el.classList.add('__hv');
  try { return fn(); }
  finally {
    el.classList.remove('__hv');
    // 入れた順の逆から消す（先に入れたルールの位置がずれないため）
    added.reverse().forEach(function (a) { try { a.sh.deleteRule(a.i); } catch (e) {} });
  }
}

// ── 起動 ────────────────────────────────────
function bootPanel() {
  // 直したCSS/JSが確実に読み直されるよう、毎回ちがう合言葉を付けて取りに行く
  var bust = '?t=' + Date.now() + '_' + (bootPanel.n = (bootPanel.n || 0) + 1);
  // cache:'no-store' が要る理由（2026-08-09に踏んだ）：file:// で開くと、合言葉（bust）を付けても
  // ブラウザが index.html を使い回すことがある。そうなると CSS/JS だけ新しく HTML だけ古い状態で
  // 検査が回り、**HTMLを直したのに全部PASSする**＝いちばん危ない嘘をつく。
  // 取りに行くたびにディスクから読ませて、必ず「いま保存されている index.html」を検査する
  return fetch('../index.html' + bust, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
    // CSS は名前を決め打ちにしない。決め打ちにすると、あとから css を1本足したときに
    // その1本だけ test/ の下を探しに行って 404 になり、見た目だけ静かに壊れる（2026-08-09に踏んだ）
    html = html.replace(/href="css\/([^"]+)"/g, 'href="../css/$1' + bust + '"')
               .replace(/<script src="js\/CSInterface\.js"><\/script>\s*/, '')
               .replace(/src="js\/([^"]+)"/g, 'src="../js/$1' + bust + '"');
    var frame = document.getElementById('panel');
    W = frame.contentWindow; D = frame.contentDocument;
    // 2回目以降（＝再起動テスト）は前回のグローバルが残っているので、
    // 読み込み完了の合図に使う2つを消してから書き直す
    try { W.filter = undefined; W.render = undefined; } catch (e) {}
    installStubs(W);
    D.open(); D.write(html); D.close();
    return new Promise(function (res, rej) {
      var n = 0;
      var t = setInterval(function () {
        if (W.filter && W.render) { clearInterval(t); res(); }
        else if (++n > 200) { clearInterval(t); rej(new Error('パネルの読み込みがタイムアウトしました')); }
      }, 25);
    });
  });
}
// 実機の「Premiereを開き直す」に相当。設定ファイルから本当に立ち上げ直す

  var NAMED_COLORS = [
    'aliceblue','antiquewhite','aqua','aquamarine','azure','beige','bisque','black',
    'blanchedalmond','blue','blueviolet','brown','burlywood','cadetblue','chartreuse','chocolate',

    'fuchsia','gainsboro','ghostwhite','gold','goldenrod','gray','green','greenyellow',
    'grey','honeydew','hotpink','indianred','indigo','ivory','khaki','lavender',
    'lavenderblush','lawngreen','lemonchiffon','lightblue','lightcoral','lightcyan','lightgoldenrodyellow','lightgray',
    'lightgreen','lightgrey','lightpink','lightsalmon','lightseagreen','lightskyblue','lightslategray','lightslategrey',
    'lightsteelblue','lightyellow','lime','limegreen','linen','magenta','maroon','mediumaquamarine',
    'mediumblue','mediumorchid','mediumpurple','mediumseagreen','mediumslateblue','mediumspringgreen','mediumturquoise','mediumvioletred',
    'midnightblue','mintcream','mistyrose','moccasin','navajowhite','navy','oldlace','olive',
    'olivedrab','orange','orangered','orchid','palegoldenrod','palegreen','paleturquoise','palevioletred',
    'papayawhip','peachpuff','peru','pink','plum','powderblue','purple','rebeccapurple',
    'red','rosybrown','royalblue','saddlebrown','salmon','sandybrown','seagreen','seashell',
    'sienna','silver','skyblue','slateblue','slategray','slategrey','snow','springgreen',
    'steelblue','tan','teal','thistle','tomato','turquoise','violet','wheat',
    'white','whitesmoke','yellow','yellowgreen'
  ];
  // 語の区切り（\b）で照合する。こうしないと darkgray の中の gray まで拾って二重に数える
  var NAMED_COLOR_RE = new RegExp('\\b(' + NAMED_COLORS.join('|') + ')\\b');
  // 名前で照合するのは「色を入れる場所」だけに限る。全部のプロパティを見ると
  // white-space: nowrap（プロパティ名に white が入っている）や
  // background-image: url(red-thing.png)（ファイル名に red）まで拾って誤検出になる。
  // 見るのは、名前が -color で終わるもの（border-left-color・outline-color・
  // -webkit-text-fill-color 等が全部入る）と、color・fill・stroke・影の2つ（box-shadow・text-shadow）だけ。
  // ブラウザは background: white を background-color: white の形にばらしてから返すので、
  // まとめ書き（background・border）で書かれていてもこれで拾える（実測で確認）
  function isColorSlot(p) {
    return /-color$/.test(p) || p === 'color' || p === 'fill' || p === 'stroke'
        || p === 'box-shadow' || p === 'text-shadow';
  }
  var hardCoded = [], varOutsideRoot = [], namedColors = [];
  (function scan(rules) {
    Array.prototype.slice.call(rules).forEach(function (r) {

      if (!r.style || r.selectorText === ':root') return;
      for (var i = 0; i < r.style.length; i++) {
        var p = r.style[i];
        var v = r.style.getPropertyValue(p);
        if (p.indexOf('--') === 0) {
          // :root 以外の規則で変数を「作って」いたら、値が何であっても落とす。
          // ここを素通りさせていたため .ghead { --sd-ghead-bg: #c6d9f1 } のような
          // 「もう1つの配色の正本」を足しても全PASSだった（3周目レビューで発覚）。
          // 変数が2か所で作られると、:root を差し替えても片方だけ取り残される
          varOutsideRoot.push(r.selectorText + ' { ' + p + ': ' + v + ' }');
          continue;
        }
        if (/#[0-9a-fA-F]{3,8}\b|\brgba?\(|\bhsla?\(/.test(v)) {
          hardCoded.push(r.selectorText + ' { ' + p + ': ' + v + ' }');

          var m = String(v).toLowerCase().replace(/url\([^)]*\)/g, '').match(NAMED_COLOR_RE);
          if (m) namedColors.push(r.selectorText + ' { ' + p + ': ' + v + ' }（名前付きの色: ' + m[1] + '）');
        }
      }

    });
    return all;
  })());
  ok('色リテラルが :root の外に1つも無い（規則への直書きが混ざっていない）',

  // 語数だけでは一覧の「中身」を見張れない。1語をすり替えても148語のままなのでこの準備は緑になり、

  // 数ではなく中身を見る：全語がブラウザに色として通ること＋同じ語を並べて数を合わせていないこと
  var notColorWords = NAMED_COLORS.filter(function (w) { return !CSS.supports('color', w); });

  // ここまでの走査は D.styleSheets を辿るやり方なので、要素に直接書いた style 属性（インラインstyle）は
  // スタイルシートに載らず1件も見えない。いまインラインstyleの色は0件＝欠陥は無いが見張りも無い状態で、

  // ＝いまと同じ色を足すと、見た目も変わらないまま全PASSだった・4周目レビューで実測）。
  // パネルのDOMに出ている style 属性を全件見る。main.js が入れる bottom（トラック選択メニューの

  var inlineColors = [];
  $$('[style]').forEach(function (el) {
    var sd = el.style;
    for (var si = 0; si < sd.length; si++) {
      var sp = sd[si], sv = sd.getPropertyValue(sp);
      var where = (el.id ? '#' + el.id : String(el.className) || el.tagName) + ' style="' + sp + ': ' + sv + '"';
      if (/#[0-9a-fA-F]{3,8}\b|\brgba?\(|\bhsla?\(/.test(sv)) inlineColors.push(where + '（色の直書き）');
      else if (isColorSlot(sp)
               && NAMED_COLOR_RE.test(String(sv).toLowerCase().replace(/url\([^)]*\)/g, ''))) {
        inlineColors.push(where + '（名前付きの色）');
      }
      // 背景画像は色の文字が入っていなくても座布団を塗りつぶせる（linear-gradient・url）
      if (sp === 'background-image' && sv && sv !== 'none' && sv !== 'initial') {

      }
    }
  });
  ok('要素に直接書いた style 属性にも色が混ざっていない（スタイルシートの走査では見えないので別に見る）',

  section('①②③④が段ごとに色分けされている（新44）');
  // ★裁定済み（項目36・レビュアーの無駄打ち防止）：①と②の色を「入れ替える」変異はここが全部通る。
  // 入れ替えても4段が4色に塗り分けられている状態は保たれるので、通るのが正しい。
  // 「どの段がどの色か」まで固定したいなら別の検査（見た目の一致）が要るが、今回の契約の範囲外。
  // テロップ工房と同じ考え方で、1段につき「左の帯・座布団（下地）・見出しの文字」の3つを同じ色にする。
  // 帯と文字だけだと、上から下へ目を動かしたときに段の切り替わりに気づけない（テロップ工房の実機指摘）。
  // 見るのは実際の要素の計算後の色。ただし「変数から来ているか」だけは計算後の色では分からない
  //（同じ色を直書きしても一致してしまう）ので、そこだけCSSの文そのものを読む（項目36の教訓）
  ok('準備：色分けを測れる状態（①の段が画面に出ている）', visible($('.sec1')));
  // 段は全部で5つ（①種類・②場所・③フリー/楽曲・③場面・③内訳）。
  // ここは長らく「.sec3」というクラス名で1件だけ測っていたが、$('.sec3') は先頭の1件しか返さないので
  // 実際に測れていたのは #licStep だけ（しかもその時点では hidden）だった。

  // hidden の段でも計算後の色は取れる（実測：#licStep も #subStep も 4px / rgb(102,48,143) を返す）
  var secDefs = [
    { sel: '.sec1',      rule: '.sec1', ruleName: '①種類',                  v: '--sd-sec1', bgv: '--sd-sec1bg', name: '①種類' },
    { sel: '.sec2',      rule: '.sec2', ruleName: '②場所',                  v: '--sd-sec2', bgv: '--sd-sec2bg', name: '②場所' },
    { sel: '#licStep',   rule: '.sec3', ruleName: '③（フリー/楽曲・場面・内訳）', v: '--sd-sec3', bgv: '--sd-sec3bg', name: '③フリー/楽曲' },
    { sel: '#sceneStep', rule: '.sec3', ruleName: '③（フリー/楽曲・場面・内訳）', v: '--sd-sec3', bgv: '--sd-sec3bg', name: '③場面' },
    { sel: '#subStep',   rule: '.sec3', ruleName: '③（フリー/楽曲・場面・内訳）', v: '--sd-sec3', bgv: '--sd-sec3bg', name: '③内訳' }
  ];
  secDefs.forEach(function (s) {

    var el = $(s.sel);

       styleOf(el ? el.querySelector('.fnum') : null, 'color'), cssVar(s.v));

  // 「色がCSSの文の中で var() から来ているか」はクラス単位の規則を読む検査なので、

  var secRuleSeen = {};

    var numRule = cssRuleFor(s.rule + ' > .fnum');

  // ④は「段」ではなく一覧なので、座布団は見出しだけに置く。

  // ①②③には帯の太さの検査があるのに④の見出しだけ抜けていた。太さを 2px にして padding で

  eq('④の見出しの左の帯が4px', styleOf(ghEl, 'borderLeftWidth'), '4px');

  var gridRule = cssRuleFor('#gridHead');

  var gnumRule = cssRuleFor('#gridHead .gnum');

  var grEl = $('#grid'), grSt = grEl ? W.getComputedStyle(grEl) : null;

  // 3周目に直した「クラスの先頭1件しか測らない」のと同じ型が、その是正と同時に足したこの検査で再発した形。
  // 段の実体7件（.sec1 / .sec2 / #licStep / #sceneStep / #subStep / #gridHead / #grid）を全部見る
  //（#grid だけは下の1件が受け持つので、ここは残りの6件）
  [['①', $('.sec1')], ['②', $('.sec2')], ['③フリー/楽曲', $('#licStep')], ['③', $('#sceneStep')],

  // 位置は小数（実測 191.5px）で出るので、ぴったり同じ数かどうかではなく1px以内かで見る
  var ghRect = ghEl ? ghEl.getBoundingClientRect() : null;

         + ' 差=' + barGap.toFixed(2) + 'px'

  var gridBarRule = cssRuleFor('#grid');

     gridBarRule ? gridBarRule.cssText : '#grid の規則が見つからない');
  eq('④の一覧の地色は塗らない（★・☑の黄色い合図を埋もれさせない）',

  // ③は「フリー/楽曲・場面・内訳」の3段に分かれるが、どれも③の絞り込みなので同じ色にする。
  // 別々の色にすると4段5段あるように見える。隠れている段も色は決まっているので一緒に測る
  var sec3Cols = ['licStep', 'sceneStep', 'subStep'].map(function (id) {
    var el = D.getElementById(id);
    if (!el) return '(段が無い:' + id + ')';
    if (!el.classList.contains('sec3')) return '(sec3が付いていない:' + id + ')';
    return W.getComputedStyle(el).borderLeftColor;
  });
  eq('③の3段（フリー/楽曲・場面・内訳）が同じ紫',
     sec3Cols.join(' | '),
     [cssVar('--sd-sec3'), cssVar('--sd-sec3'), cssVar('--sd-sec3')].join(' | '));

  // 4つが同じ色だと色分けにならない。変数どうしではなく実際の要素の帯の色で比べる
  var barCols = [$('.sec1'), $('.sec2'), $('#sceneStep'), $('#gridHead')].map(function (el) {
    return styleOf(el, 'borderLeftColor');
  });
  ok('①②③④の帯が全部ちがう色',
     barCols.filter(function (c, i) { return barCols.indexOf(c) === i; }).length === 4,
     barCols.join(' | '));
  // 座布団がパネルの地色と同じでは「塗った」ことにならない（色分けが見えない）
  var bodyBg = W.getComputedStyle(D.body).backgroundColor;
  var seatCols = [$('.sec1'), $('.sec2'), $('#sceneStep'), $('#gridHead')].map(function (el) {
    return styleOf(el, 'backgroundColor');
  });
  // 「地色と違う」だけでは足りない。塗るのをやめると透明（rgba(0,0,0,0)）になり、
  // 見た目はパネルの地色そのものなのに「地色と違う」は通ってしまう（変異テストで発覚・2026-08-04）
  ok('①②③④の座布団がちゃんと塗られている（透明のままでない）',
     seatCols.every(function (c) { return c !== 'transparent' && !/rgba\([^)]*,\s*0\)/.test(c); }),
     seatCols.join(' | '));
  ok('①②③④の座布団がパネルの地色と違う（塗った意味がある）',
     seatCols.every(function (c) { return c !== bodyBg; }), seatCols.join(' | ') + ' / 地色=' + bodyBg);
  ok('①②③④の座布団も全部ちがう色',
     seatCols.filter(function (c, i) { return seatCols.indexOf(c) === i; }).length === 4,
     seatCols.join(' | '));

  // 「値が違う」だけでは色分けにならない。人の目で見分けられる差（ΔE2000で10以上）が要る。
  // とくに④の一覧の中にはグループ見出しの帯（--sd-ghead-bg）がグループの数だけ並ぶので、
  // ①の座布団がその帯と似ていると「この色＝①の段」の印が④の区画の中で何度も繰り返され、
  // 段ごとの色分けという意味そのものが壊れる（最初の #cfe0f5 と #c6d9f1 は ΔE2000＝2.0＝
  // 並べても見分けられない値だったのに、上の「全部ちがう色」は通っていた。1周目レビューで発覚）。
  // 測るのは変数どうしではなく実物の要素の計算後の色（項目36の教訓）。★よく使う帯と☑選択中の行は
  // この時点では画面に出ていないので、実物の要素に一時的にそのクラスを付けて本物の色を出させる
  var gheadEl = $('#grid .ghead:not(.fav)'), rowEl = $('#grid .card.row');
  ok('準備：④の一覧にグループ見出しと行が出ている（合図色を実物から測るため）',
     !!gheadEl && !!rowEl, '見出し=' + !!gheadEl + ' 行=' + !!rowEl);
  var signalCols = [
    ['④のグループ見出しの帯', gheadEl ? W.getComputedStyle(gheadEl).backgroundColor : '(見出しが無い)'],
    ['★よく使う帯', bgWithClass(gheadEl, 'fav')],
    ['☑選択中の行', bgWithClass(rowEl, 'checked')],
    ['パネルの地色', bodyBg]
  ];
  var seatNames = ['①', '②', '③', '④'];
  function deLabel(a, b) { var d = deltaE(a, b); return { d: d, t: d < 0 ? '測れない' : d.toFixed(1) }; }
  var tooClose = [];
  seatCols.forEach(function (sc, i) {
    signalCols.forEach(function (sig) {
      var r = deLabel(sc, sig[1]);
      if (!(r.d >= 10)) {
        tooClose.push(seatNames[i] + 'の座布団 ' + sc + ' vs ' + sig[0] + ' ' + sig[1] + ' → ΔE=' + r.t);
      }
    });
  });
  ok('①②③④の座布団が、パネル内の既存の合図色（グループ見出し・★・☑・地色）と見分けられる（ΔE2000が10以上）',
     tooClose.length === 0, tooClose.join(' ／ '));
  var seatTooClose = [];
  seatCols.forEach(function (a, i) {
    seatCols.slice(i + 1).forEach(function (b, j) {
      var r = deLabel(a, b);
      if (!(r.d >= 10)) {
        seatTooClose.push(seatNames[i] + ' vs ' + seatNames[i + 1 + j] + ' → ΔE=' + r.t);
      }
    });
  });
  ok('①②③④の座布団どうしも見分けられる（ΔE2000が10以上）',
     seatTooClose.length === 0, seatTooClose.join(' ／ '));
  // 座布団だけ ΔE で見張っても、帯と見出しの文字が人の目で同じ色なら段の区別は付かない。

  // 20.6 と書いてあったのは①の濃い側が #164a80 だったころの数字で、いまの #00566a には合わない
  var barTooClose = [];
  barCols.forEach(function (a, i) {
    barCols.slice(i + 1).forEach(function (b, j) {
      var r = deLabel(a, b);
      if (!(r.d >= 10)) barTooClose.push(seatNames[i] + ' vs ' + seatNames[i + 1 + j] + ' → ΔE=' + r.t);

  ok('①②③④の帯・見出しの文字どうしも見分けられる（ΔE2000が10以上）',

  // 座布団は④の一覧の中の合図色と比べていたのに、濃いほう（帯と見出しの文字）は誰とも比べていなかった。
  // ④の一覧の中にはグループの数だけ濃い青系の色が並ぶ（見出しの文字・▾矢印・件数・件数バッジ）ので、

  // 変数どうしではなく実物の要素の計算後の色で測る（項目36の教訓）
  var darkEls = [

    ['④の件数', $('#gridCount')],
    ['④の件数バッジ', $('#grid .gcount')]
  ];
  ok('準備：④の一覧の中の濃い色4つを実物から測れる',
     darkEls.every(function (d) { return !!d[1]; }),
     darkEls.map(function (d) { return d[0] + '=' + !!d[1]; }).join(' '));
  var inkCols = [
    ['①の帯', barCols[0]], ['②の帯', barCols[1]], ['③の帯', barCols[2]], ['④の帯', barCols[3]],
    ['①の見出しの文字', styleOf($('.sec1 > .fnum'), 'color')],
    ['②の見出しの文字', styleOf($('.sec2 > .fnum'), 'color')],
    ['③の見出しの文字', styleOf($('#sceneStep > .fnum'), 'color')],
    ['④の見出しの文字', styleOf($('#gridHead .gnum'), 'color')]
  ];
  var inkTooClose = [];
  inkCols.forEach(function (ink) {
    darkEls.forEach(function (d) {
      var dc = styleOf(d[1], 'color');
      var r = deLabel(ink[1], dc);
      if (!(r.d >= 10)) {
        inkTooClose.push(ink[0] + ' ' + ink[1] + ' vs ' + d[0] + ' ' + dc + ' → ΔE=' + r.t);
      }

  ok('①②③④の帯・見出しの文字が、④の一覧の中の濃い色（見出しの文字・▾矢印・件数・件数バッジ）とも見分けられる（ΔE2000が10以上）',

  var seeThrough = seatCols.filter(function (c) {

     seeThrough.length === 0, seeThrough.join(' | '));
  // 座布団そのものが不透明でも、上に載る部品がパネルの地色を塗り返すと見た目は無塗装に戻る。

  // 面積の割合で見張るのは無理で、③は健全な状態でもプルダウンが行を埋めて 22% しか見えていない。
  // 代わりに「地色と見分けが付かない色（ΔE2000が2未満＝人の目で同じ）を塗り返していないか」で見る。
  // 段の中で実際に塗られている色は 白い入力欄 #ffffff（地色と ΔE=5.1）と 選択中のボタン（42.2）だけなので
  // 誤検出しない（実測）。※「地色ではないが座布団を覆う色」までは見張っていない（別の欠陥）
  var repaint = [];
  [$('.sec1'), $('.sec2'), $('#sceneStep'), $('#gridHead')].forEach(function (el, i) {
    if (!el) return;
    Array.prototype.slice.call(el.querySelectorAll('*')).forEach(function (c) {

      var m = String(bc).match(/rgba?\(([^)]*)\)/);
      if (!m) return;
      var pp = m[1].split(',');
      if (pp.length >= 4 && parseFloat(pp[3]) === 0) return;
      var d = deltaE(bc, bodyBg);
      if (d >= 0 && d < 2) {
        repaint.push(seatNames[i] + 'の中の ' + (c.id ? '#' + c.id : String(c.className) || c.tagName)
          + ' が ' + bc + '（地色と ΔE=' + d.toFixed(1) + '）');

  ok('①②③④の座布団の上に、部品がパネルの地色を塗り返していない',

  // 書けるので、色リテラルの検査にも名前付きの色の検査にも原理的に引っかからない。

  var COMPOSITE_DEFAULTS = [

    ['boxShadow', 'none', '影'],
    ['opacity', '1', '透明度'],
    ['filter', 'none', 'フィルタ'],

    // 正当な使い方があり、部品が消えても座布団が覆われるわけではない＝覆いの話ではないため
    ['visibility', 'visible', '表示/非表示']
  ];

    if (!el) return [who + ' の要素が無い'];
    var out = [], cs = W.getComputedStyle(el);
    COMPOSITE_DEFAULTS.forEach(function (d) {
      if (!withVisibility && d[0] === 'visibility') return;
      if (cs[d[0]] !== d[1]) {

    ['::before', '::after'].forEach(function (pe) {

  ok('チェックを付けると⋯に印が付く', $('#btnMore').classList.contains('mark'), '');
  eq('印の色は☑モードONと同じ（チェックまわりの話だと分かる）',
     styleOf($('#btnMore'), 'backgroundColor'), cssVar('--sd-mark-bg'));
  ok('ホバー説明に書き出しの道順が出る',
     attrOf($('#btnMore'), 'title').indexOf(btnLabel('btnSend')) >= 0, attrOf($('#btnMore'), 'title'));
  click($('#btnClearChecks')); await tick();
  ok('全解除すると印も消える', !$('#btnMore').classList.contains('mark'), '');
  ok('ホバー説明も元に戻る', attrOf($('#btnMore'), 'title').indexOf(btnLabel('btnSend')) < 0, attrOf($('#btnMore'), 'title'));

  section('わざと壊しても気づける形になっているか（検査の穴・新59）');
  // 下の5つは1周目レビューで「変異させても素通りする」と指摘された箇所。
  // ここが赤くならない変更は、そのまま実機の不具合として出る

  // (1) esc() を外す＝画面の文字がそのままHTMLとして描かれる（タグ名のフォルダで壊れる）
  W.filtersCollapsed = true; W.applyFilterCollapsed(); await tick();
  var kb = kindBtn('bgm');
  var kbText = kb.textContent;
  kb.textContent = '<img src=x onerror="window.__xss=1">';
  click(kb); await tick();
  W.updateFilterSummary();
  ok('サマリーは文字として描く（HTMLとして解釈しない）', !$('#fsumText').querySelector('img'), $('#fsumText').innerHTML);
  ok('危ない名前でも中身がそのまま読める', $('#fsumText').textContent.indexOf('<img') >= 0, $('#fsumText').textContent);
  ok('埋め込まれたスクリプトが動いていない', !W.__xss, 'window.__xss が立った');
  kb.textContent = kbText; click(kindBtn('')); await tick();
  W.filtersCollapsed = false; W.applyFilterCollapsed(); await tick();

  // (2) ⚙設定がフッターを覆うと、下の操作列（一括挿入・☑モード）が押せなくなる
  click($('#btnSettings')); await tick();
  var setR = $('#setMenu').getBoundingClientRect();
  var footR = $('#footer').getBoundingClientRect();
  ok('⚙設定はフッターの上に出る（フッターを覆わない）', setR.bottom <= footR.top + 1,
     '⚙設定の下端=' + Math.round(setR.bottom) + ' / フッターの上端=' + Math.round(footR.top));
  ok('⚙設定の上端が画面の中', setR.top >= 0, '上端=' + Math.round(setR.top));
  click(D.body); await tick();

  // (3) ⋯ が画面の外に開くと、中の4つに一生たどり着けない
  click($('#btnMore')); await tick();
  var moreR = $('#moreMenu').getBoundingClientRect();
  var barR = $('#btnMore').getBoundingClientRect();
  ok('⋯の中身は⋯ボタンのすぐ下に出る', moreR.top >= barR.bottom - 1 && moreR.top <= barR.bottom + 8,
     '中身の上端=' + Math.round(moreR.top) + ' / ボタンの下端=' + Math.round(barR.bottom));
  ok('⋯の中身が画面の中に収まる',
     moreR.top >= 0 && moreR.left >= 0 && moreR.right <= W.innerWidth + 1 && moreR.bottom <= W.innerHeight + 1,
     JSON.stringify({ top: Math.round(moreR.top), left: Math.round(moreR.left),
                      right: Math.round(moreR.right), bottom: Math.round(moreR.bottom),
                      w: W.innerWidth, h: W.innerHeight }));

  // (5) 開いたまま幅が変わったら置き直す。上端は⋯ボタンの位置から毎回計算するので、
  //     再配置を消すと「ボタンは動いたのに中身は元の高さのまま」になって離れる
  var widths = [460, 280, 380];
  for (var mi = 0; mi < widths.length; mi++) {
    await setFrame(widths[mi]);
    var mr = $('#moreMenu').getBoundingClientRect();
    var br = $('#btnMore').getBoundingClientRect();
    ok('幅' + widths[mi] + 'pxに変えても⋯の中身がボタンの真下に付いてくる',
       mr.top >= br.bottom - 1 && mr.top <= br.bottom + 8,
       '中身の上端=' + Math.round(mr.top) + ' / ボタンの下端=' + Math.round(br.bottom));
    ok('幅' + widths[mi] + 'pxで⋯の中身が画面からはみ出さない',
       mr.right <= W.innerWidth + 1 && mr.left >= 0,
       '左=' + Math.round(mr.left) + ' 右=' + Math.round(mr.right) + ' / 画面幅=' + W.innerWidth);
  }
  click(D.body); await tick();
  // ⚙設定はフッターの高さから場所を決めているので、置き直しを消すと本当に壊れるのはこちら。
  // 細くしてフッターが2行に折り返すと、置き直しが無い⚙設定はフッターに重なり、
  // その裏の「一括挿入」「☑モード」が押せなくなる
  await setFrame(380);
  var footTall0 = hOf('#footer');
  click($('#btnSettings')); await tick();
  await setFrame(220);
  ok('（前提）幅220pxではフッターが2行に折り返して高くなる', hOf('#footer') > footTall0,
     '幅380px=' + footTall0 + 'px / 幅220px=' + hOf('#footer') + 'px');
  var setR3 = $('#setMenu').getBoundingClientRect(), footR3 = $('#footer').getBoundingClientRect();
  ok('フッターが高くなっても⚙設定は置き直されて重ならない', setR3.bottom <= footR3.top + 1,
     '⚙設定の下端=' + Math.round(setR3.bottom) + ' / フッターの上端=' + Math.round(footR3.top));
  click(D.body); await tick();
  await setFrame(380);

  // (4) 畳んだサマリーの左の帯（①②③の3色）。この1行を消すと「どの段が畳まれているか」の手がかりが消える
  W.filtersCollapsed = true; W.applyFilterCollapsed(); await tick();
  var bimg = styleOf($('#filterSummary'), 'borderImageSource');
  ['--sd-sec1', '--sd-sec2', '--sd-sec3'].forEach(function (v) {
    ok('サマリーの帯に' + v + 'の色が入っている', bimg.indexOf(cssVar(v)) >= 0, bimg);
  });
  ok('帯は3色の縦グラデーション（単色にしない）', bimg.indexOf('gradient') >= 0, bimg);
  W.filtersCollapsed = false; W.applyFilterCollapsed(); await tick();

  section('④の一覧にどれだけ縦が渡ったか（改修の目的そのもの・新60）');
  // 深いテスト状態のまま測ると値がずれるので、いちど立ち上げ直してから測る。
  // 改修前（2026-08-09 の実測）：高660で 360px（9.7行）／高490で 140px（3.8行）
  await reboot();
  W.filtersCollapsed = false; W.applyFilterCollapsed();
  await setFrame(380, 660);
  var rowPitch = 33;   // 1行31px＋すき間2px
  var g660open = hOf('#grid');
  ok('高さ660pxで一覧が420px以上（改修前360px）', g660open >= 420, g660open + 'px ≒ ' + (g660open / rowPitch).toFixed(1) + '行');
  W.filtersCollapsed = true; W.applyFilterCollapsed(); await tick();
  var g660col = hOf('#grid');
  ok('高さ660pxで畳めば470px以上', g660col >= 470, g660col + 'px ≒ ' + (g660col / rowPitch).toFixed(1) + '行');
  W.filtersCollapsed = false; W.applyFilterCollapsed();
  await setFrame(380, 490);
  var g490open = hOf('#grid');
  ok('高さ490pxで一覧が250px以上（改修前140px）', g490open >= 250, g490open + 'px ≒ ' + (g490open / rowPitch).toFixed(1) + '行');
  W.filtersCollapsed = true; W.applyFilterCollapsed(); await tick();
  var g490col = hOf('#grid');
  ok('高さ490pxで畳めば300px以上', g490col >= 300, g490col + 'px ≒ ' + (g490col / rowPitch).toFixed(1) + '行');
  // 測った値そのものを結果に残す（次に触った人が「前はいくつだったか」を探さなくて済む）
  lines.push('  実測  ④の一覧の高さ：高660 開' + g660open + 'px(' + (g660open / rowPitch).toFixed(1) +
             '行)・畳' + g660col + 'px(' + (g660col / rowPitch).toFixed(1) +
             '行)／高490 開' + g490open + 'px(' + (g490open / rowPitch).toFixed(1) +
             '行)・畳' + g490col + 'px(' + (g490col / rowPitch).toFixed(1) + '行)');
  W.filtersCollapsed = false; W.applyFilterCollapsed(); await tick();
}
</script>
</body>
</html>
